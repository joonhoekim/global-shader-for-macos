name: release

# Pushing a v* tag creates a **draft** release. A draft, because the zip it produces now
# must not be handed to anyone — without notarization the downloader's macOS refuses to
# open it. The details are in the header of tools/release.sh.
#
# Once there is an account, the "signing" step gets filled in and this becomes draft: false.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: glslang · spirv-cross
        run: brew install glslang spirv-cross

      # A tag that diverges from VERSION splits the cask's version from what the app says,
      # and then brew upgrade calls it "up to date" forever. Stopped here.
      - name: tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          want="$(tr -d '[:space:]' < VERSION)"
          echo "tag $tag · VERSION $want"
          [ "$tag" = "$want" ]

      - name: package
        run: GS_BUILD_NUMBER="${{ github.run_number }}" ./tools/release.sh

      - name: write the sha256 into the summary
        run: |
          zip=$(ls build/dist/*.zip)
          sha=$(shasum -a 256 "$zip" | cut -d' ' -f1)
          {
            echo "### values for the cask"
            echo '```ruby'
            echo "version \"$(tr -d '[:space:]' < VERSION)\""
            echo "sha256 \"$sha\""
            echo '```'
            echo
            echo "⚠ Not notarized yet, so this zip will not open for whoever downloads it."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: true
          files: build/dist/*.zip
          body: |
            ⚠ **Not notarized yet.** Downloading and opening this zip gets a macOS
            "is damaged" refusal. Nothing is damaged; the signature is missing.

            Building from source:

            ```sh
            brew install glslang spirv-cross
            ./build.sh
            open build/GlobalShader.app
            ```
